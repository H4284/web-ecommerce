name: ci
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - run: pnpm test:rules
      - run: pnpm test:emulator
      - name: e2e golden path
        env:
          CI: "1"
          GCLOUD_PROJECT: demo-sanem
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          NEXT_PUBLIC_USE_EMULATORS: "1"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3010
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-sanem.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-sanem
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-sanem.appspot.com
          NEXT_PUBLIC_FIREBASE_APP_ID: demo-app
          NEXT_PUBLIC_STORAGE_ORIGIN: http://127.0.0.1:9199
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
          TURNSTILE_SECRET_KEY: ""
          ORDER_LINK_SECRET: e2e-order-link-secret
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3010
          PORT: "3010"
        run: pnpm test:e2e
